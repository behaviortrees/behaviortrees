# The classic editor (apps/editor-classic) is left out on purpose: it is a
# frozen gulp 3 toolchain that is never upgraded, only rebuilt.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
