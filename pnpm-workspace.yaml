packages:
  - apps/*
  - packages/*
  # The classic gulp/bower editor is intentionally NOT a workspace member: it
  # keeps its own npm lockfile (with the graceful-fs override) because the
  # gulp 3 toolchain predates pnpm-style layouts. Never run pnpm in there.
  - '!apps/editor-classic'

# Force patched versions of transitives that their parents pin below the
# Dependabot fix.
overrides:
  sharp: ^0.35.4
  js-yaml@4: ^4.3.2
  minimatch@10: ^10.2.3
  smol-toml: ^1.7.1
  # tsx 4.21 (an optional vite peer) pins esbuild ~0.27.
  esbuild@0.27: ^0.28.1

# posthog-cli's postinstall downloads its native binary, which uploads the
# editor's source maps to PostHog during the Vercel build.
onlyBuiltDependencies:
  - '@posthog/cli'

# Vercel typechecks api/ functions with a TypeScript language service that
# doesn't resolve symlinks, so from @types/node's symlinked path it can't see
# undici-types inside .pnpm, and fetch's Response types as an empty interface.
# Hoisting it to the root node_modules puts it on that lookup path.
publicHoistPattern:
  - undici-types
